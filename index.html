<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TiMY Dual-Track Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; }
    body { background: #361763; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #4c2882; padding: 6px 14px; display: flex; justify-content: space-between; align-items: center; color: white; border-bottom: 2px solid rgba(255,255,255,0.15); }
    .brand { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
    .tabs { display: flex; background: rgba(0,0,0,0.3); padding: 3px; border-radius: 30px; gap: 4px; }
    .tab-btn { border: none; padding: 6px 14px; border-radius: 20px; font-weight: 800; background: transparent; color: #d1c4e9; cursor: pointer; }
    .tab-btn.active { background: linear-gradient(135deg, #ff77a9, #ff4081); color: #fff; transform: scale(1.04); }

    .arena { flex: 1; display: flex; flex-direction: column; padding: 8px 10px; gap: 10px; overflow: hidden; }
    
    /* OVERALL TIMER BORDER - Shrinks via JavaScript */
    .lane { flex: 1; border-radius: 24px; border: 12px solid #ffffff; display: flex; position: relative; overflow: hidden; transition: border-width 1s linear; }
    .lane-harper { background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 40%, #b2ebf2 100%); }
    .lane-haisley { background: linear-gradient(135deg, #bbdefb 0%, #90caf9 40%, #b2dfdb 100%); }

    .sidebar { width: 110px; background: rgba(255,255,255,0.25); border-right: 3px solid rgba(255,255,255,0.4); display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 6px; z-index: 10; }
    .avatar-ring { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .name-tag { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    /* INDIVIDUAL PIE TIMER */
    .pie-timer { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(#ff4081 100%, rgba(255,255,255,0.4) 0); box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; }
    .lane-haisley .pie-timer { background: conic-gradient(#1976d2 100%, rgba(255,255,255,0.4) 0); }
    .pie-inner { width: 44px; height: 44px; background: #fff; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pie-inner span { font-size: 13px; font-weight: 900; color: #333; }

    /* MISSION TIME DISPLAY */
    .mission-time { font-size: 10px; font-weight: 900; color: #fff; text-align: center; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 8px; margin-top: -5px; }

    .trail { flex: 1; display: flex; align-items: center; padding: 0 25px; position: relative; gap: 12px; overflow-x: auto; }
    .trail-line { position: absolute; left: 30px; right: 50px; height: 12px; background: rgba(255,255,255,0.4); border: 2px dashed #ffffff; border-radius: 8px; z-index: 1; }
    
    .stone { width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 4px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; cursor: pointer; position: relative; }
    .stone .icon { font-size: 26px; }
    .stone .label { position: absolute; bottom: -22px; background: #fff; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 900; white-space: nowrap; }
    
    .stone.active { transform: scale(1.15); border-color: #ffd54f; box-shadow: 0 0 0 4px rgba(255,213,79,0.5); }
    .stone.done { background: #c8e6c9; border-color: #4caf50; transform: scale(0.9); opacity: 0.8; }
    
    .avatar-token { position: absolute; top: -20px; right: -8px; width: 34px; height: 34px; background: #ffeb3b; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 10; animation: bounce 0.6s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

    .goal-castle { z-index: 2; text-align: center; margin-left: 10px; }
    .castle-icon { font-size: 40px; }
    .goal-badge { background: #ffb300; color: #fff; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 10px; }
    .free-time-badge { background: #00e676; color: #fff; font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 12px; margin-top: 4px; display: none; animation: pop 0.5s ease-out; }
    @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div style="background:#00e5ff; border-radius:50%; width:24px; height:24px; text-align:center;">⏱️</div> TiMY</div>
    <div class="tabs">
      <button class="tab-btn active">☀️ Morning</button>
      <button class="tab-btn">⚡ Chores</button>
      <button class="tab-btn">🌙 Bedtime</button>
    </div>
    <div style="width:24px;"></div>
  </header>

  <div class="arena">
    <!-- Harper -->
    <div class="lane lane-harper" id="laneHarper">
      <div class="sidebar">
        <div class="avatar-ring">🐱</div>
        <div class="name-tag">Harper</div>
        <div class="pie-timer" id="pieHarper" onclick="startPreview('Harper')">
          <div class="pie-inner"><span id="txtHarper">3:00</span></div>
        </div>
        <div class="mission-time" id="totalHarper">Total: 25:00</div>
      </div>
      <div class="trail">
        <div class="trail-line"></div>
        <div class="stone done"><span class="icon">⭐</span><span class="label">Clothes</span></div>
        <div class="stone active"><div class="avatar-token">🐱</div><span class="icon">🪥</span><span class="label">Teeth</span></div>
        <div class="stone"><span class="icon">🎒</span><span class="label">Backpack</span></div>
        <div class="goal-castle">
          <div class="castle-icon">🏰</div>
          <div class="goal-badge" id="badgeHarper">REWARD!</div>
          <div class="free-time-badge" id="freeHarper">22:00 FREE TIME!</div>
        </div>
      </div>
    </div>

    <!-- Haisley -->
    <div class="lane lane-haisley" id="laneHaisley">
      <div class="sidebar">
        <div class="avatar-ring">🐶</div>
        <div class="name-tag">Haisley</div>
        <div class="pie-timer" id="pieHaisley" onclick="startPreview('Haisley')">
          <div class="pie-inner"><span id="txtHaisley">3:00</span></div>
        </div>
        <div class="mission-time" id="totalHaisley">Total: 25:00</div>
      </div>
      <div class="trail">
        <div class="trail-line"></div>
        <div class="stone done"><span class="icon">⭐</span><span class="label">Clothes</span></div>
        <div class="stone active"><div class="avatar-token">🐶</div><span class="icon">🪥</span><span class="label">Teeth</span></div>
        <div class="stone"><span class="icon">🎒</span><span class="label">Backpack</span></div>
        <div class="goal-castle">
          <div class="castle-icon">🏰</div>
          <div class="goal-badge" id="badgeHaisley">REWARD!</div>
          <div class="free-time-badge" id="freeHaisley">22:00 FREE TIME!</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // PREVIEW ANIMATION SCRIPT (Sped up for testing)
    function startPreview(child) {
      let stepTime = 180; // 3 mins in seconds
      let totalTime = 1500; // 25 mins total
      const maxBorder = 12; // Starting border width

      setInterval(() => {
        if (stepTime > 0) stepTime -= 2; // Speeding up time for the preview
        if (totalTime > 0) totalTime -= 2;

        // 1. Update Pie Chart
        const pct = (stepTime / 180) * 100;
        const color = child === 'Harper' ? '#ff4081' : '#1976d2';
        document.getElementById('pie' + child).style.background = `conic-gradient(${color} ${pct}%, rgba(255,255,255,0.4) 0)`;
        
        let sM = Math.floor(Math.max(0, stepTime) / 60);
        let sS = Math.max(0, stepTime) % 60;
        document.getElementById('txt' + child).textContent = `${sM}:${String(sS).padStart(2,'0')}`;

        // 2. Update Overall Border Thickness
        const borderPct = totalTime / 1500;
        document.getElementById('lane' + child).style.borderWidth = `${Math.max(2, maxBorder * borderPct)}px`;

        let tM = Math.floor(Math.max(0, totalTime) / 60);
        let tS = Math.max(0, totalTime) % 60;
        document.getElementById('total' + child).textContent = `Total: ${tM}:${String(tS).padStart(2,'0')}`;

        // 3. Simulate hitting the Castle & Free Time!
        if (stepTime <= 0) {
          document.getElementById('badge' + child).style.display = 'none';
          const freeBadge = document.getElementById('free' + child);
          freeBadge.style.display = 'block';
          freeBadge.textContent = `${tM}:${String(tS).padStart(2,'0')} FREE TIME!`;
        }
      }, 100); // Ticks fast for the visual preview
    }
  </script>
</body>
</html>
